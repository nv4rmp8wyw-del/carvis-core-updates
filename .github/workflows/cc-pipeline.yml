# CARVIS CORE – kostenlose Build- und Veröffentlichungsstrecke (Inhaber-Entscheidung 13.11.2026, 23:43).
#
# Warum hier? Im privaten Quell-Repo ist das kostenlose Actions-Kontingent aufgebraucht; Budget 0 €.
# In öffentlichen Repos sind GitHub Actions kostenlos. Der Quellcode bleibt privat: er wird nur zum Bauen
# und Testen ausgecheckt, nie hochgeladen. Öffentlich sind (wie bisher) nur Website und geprüfte Installer.
# Hinweis: Protokolle dieser Läufe sind öffentlich sichtbar.
#
# Ablauf:
#   1. alle 20 Minuten (oder von Hand): neuer Commit auf main im privaten Repo?
#   2. Tests wie im privaten ci.yml (Agent, Syntax, Browser mit echten Klicks, echte KI mit Ollama)
#   3. Windows: Installer + portable EXE bauen, installieren, starten, Migration 3.6.7, Update-Kette, portabler Start
#   4. NUR wenn alles grün und Quelle = main und Version freigegeben (3.x immer; ab 4.0 nur mit Eintrag in
#      .github/release-freigabe.txt): Website (gh-pages) aktualisieren; bei neuer Versionsnummer öffentliches Release.
#
# Secret SOURCE_TOKEN: fein granularer Zugriffsschlüssel NUR für nv4rmp8wyw-del/carvis-core-c, "Contents: Read-only".
#
# TEST-Kanal (Inhaber 15.11.2026, D-048): nächste Version PRIVAT bauen und testen, ohne öffentliche Dateien.
#   - automatisch um :10/:30/:50 (Zweig vars.TEST_ZWEIG, Standard feature/v1.1) oder von Hand mit kanal=test
#   - gebaut mit eigener Kennung de.carviscore.app.test (oder je Version aus src-tauri/test-identifier.txt) / Name „CARVIS CORE TEST“ (überschreibt STABLE nie)
#   - KEIN öffentliches Artefakt, KEINE Website, KEIN öffentliches Release. Installer, portable EXE, Web-Paket und
#     Prüfsummen gehen nur als Pre-Release v<Version>-test.<Lauf> in das PRIVATE Repo; zuerst als Entwurf, erst nach
#     allen grünen Tests sichtbar (sonst gelöscht). Das Update-Center (Entwicklerkanal, GitHub-Anmeldung) bietet es an.
#   - Secret TEST_RELEASE_TOKEN: fein granularer Schlüssel NUR für carvis-core-c, "Contents: Read and write".
#     Sicherheitsmodell (Inhaber 15.11.2026): Der Schreibschlüssel ist NIE in einem Job verfügbar, in dem Projektcode,
#     Build-Skripte, npm/pip-Pakete oder Drittanbieter-Actions laufen. Er wird nur in zwei Jobs gelesen, die nichts
#     auschecken und nur Systemwerkzeuge (openssl, tar, sha256sum, gh) sowie offizielle actions/*-artifact nutzen:
#       schluessel      – erzeugt pro Lauf ein Einweg-Schlüsselpaar; der private Teil wird nur verschlüsselt abgelegt
#       test-freigeben  – läuft NUR, wenn alle Test-Jobs erfolgreich waren; entschlüsselt, prüft SHA-256 und Dateinamen,
#                         legt das private Pre-Release an
#     Der Build-Job bekommt nur den öffentlichen Schlüssel und übergibt Installer/EXE/Web-Paket ausschließlich
#     verschlüsselt (Artefakt 1 Tag, ohne den privaten Schlüssel unlesbar). Kein öffentliches Klartext-Artefakt.
#     Prüfung dieser Regeln: carvis-core-c/tools/test-pipeline-security.py
#   - Hinweis: Auch die Protokolle der TEST-Läufe sind öffentlich (Testnamen, Dateinamen, Prüfsummen; kein Quellcode).
name: CC bauen, testen, veröffentlichen
on:
  schedule:
    - cron: "*/20 * * * *"        # STABLE (main)
    - cron: "10,30,50 * * * *"    # TEST (vars.TEST_ZWEIG, Standard feature/v1.1)
  workflow_dispatch:
    inputs:
      ref:
        description: "Zweig/Commit im privaten Repo (leer = main bzw. beim TEST-Kanal der Testzweig)"
        default: ""
      kanal:
        description: "stable = öffentlich nach Freigabe · test = nur privates Pre-Release, nie öffentlich"
        type: choice
        options: [stable, test]
        default: stable
      veroeffentlichen:
        description: "Bei Erfolg veröffentlichen (nur wirksam für main)"
        type: boolean
        default: true
      erzwingen:
        description: "Auch bauen, wenn dieser Commit schon veröffentlicht ist"
        type: boolean
        default: false
concurrency:
  group: cc-pipeline-${{ (github.event.inputs.kanal == 'test' || github.event.schedule == '10,30,50 * * * *') && 'test' || 'stable' }}-${{ github.event.inputs.ref || 'auto' }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  QUELLE: nv4rmp8wyw-del/carvis-core-c
  KANAL: ${{ (github.event.inputs.kanal == 'test' || github.event.schedule == '10,30,50 * * * *') && 'test' || 'stable' }}
  REF: ${{ github.event.inputs.ref || ((github.event.inputs.kanal == 'test' || github.event.schedule == '10,30,50 * * * *') && (vars.TEST_ZWEIG || 'feature/v1.1')) || 'main' }}

jobs:
  pruefen:
    name: Neuer Stand?
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.s.outputs.sha }}
      bauen: ${{ steps.s.outputs.bauen }}
      kanal: ${{ steps.s.outputs.kanal }}
    steps:
      - name: Commit im privaten Repo ermitteln
        id: q
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Secret SOURCE_TOKEN fehlt (siehe Kopf dieser Datei)."; exit 1; fi
          echo "sha=$(gh api "repos/$QUELLE/commits/$REF" --jq .sha)" >> "$GITHUB_OUTPUT"
      - name: "TEST: Ist dieser Stand schon einmal fehlgeschlagen? (Merker, verhindert endlose identische Fehlversuche)"
        id: fv
        if: env.KANAL == 'test'
        uses: actions/cache/restore@v4
        with:
          path: fehlversuch.txt
          key: test-fehlversuch-${{ steps.q.outputs.sha }}
          lookup-only: true
      - name: Commit im privaten Repo und letzten veröffentlichten Stand vergleichen
        id: s
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          ERZWINGEN: ${{ github.event.inputs.erzwingen || 'false' }}
          VON_HAND: ${{ github.event_name == 'workflow_dispatch' }}
          SHA: ${{ steps.q.outputs.sha }}
          FEHLVERSUCH: ${{ steps.fv.outputs.cache-hit }}
        run: |
          sha="$SHA"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "kanal=$KANAL" >> "$GITHUB_OUTPUT"
          if [ "$KANAL" = "test" ]; then
            nein() { echo "TEST $REF = ${sha::7}: $1"; echo "::notice title=TEST-Kanal::$1"; echo "bauen=nein" >> "$GITHUB_OUTPUT"; exit 0; }
            rel=$(gh api "repos/$QUELLE/releases?per_page=30" --jq '[.[] | select(.prerelease and (.tag_name|test("-test\\.")))] | .[0].body // ""')
            # 1) genau dieser Stand ist schon als privates Test-Release vorhanden (Kennung „Quelle: <sha>“)
            if gh api "repos/$QUELLE/releases?per_page=30" --jq '.[] | select(.prerelease) | .body' | grep -q "Quelle: $sha" && [ "$ERZWINGEN" != "true" ]; then nein "bereits als privates Test-Release vorhanden."; fi
            # 2) derselbe Stand ist schon fehlgeschlagen: nicht alle 20 min wiederholen (neuer Commit oder Start von Hand baut neu)
            if [ "$FEHLVERSUCH" = "true" ] && [ "$VON_HAND" != "true" ] && [ "$ERZWINGEN" != "true" ]; then nein "derselbe Stand ist bereits fehlgeschlagen – kein automatischer Wiederholungsversuch (Diagnose im fehlgeschlagenen Lauf; neuer Commit oder Start von Hand baut neu)."; fi
            # 3) seit dem letzten Testbuild nur Dokumentation geändert: kein neuer Testbuild
            letzt=$(printf '%s' "$rel" | sed -n 's/^Quelle: \([0-9a-f]\{40\}\).*/\1/p' | head -1)
            if [ -n "$letzt" ] && [ "$letzt" != "$sha" ] && [ "$ERZWINGEN" != "true" ] && [ "$VON_HAND" != "true" ]; then
              geaendert=$(gh api "repos/$QUELLE/compare/$letzt...$sha" --jq '.files[].filename' 2>/dev/null || echo "?")
              if [ -n "$geaendert" ] && ! printf '%s\n' "$geaendert" | grep -qvE '^docs/|\.md$'; then nein "seit dem letzten Testbuild (${letzt::7}) nur Dokumentation geändert – kein neuer Testbuild."; fi
            fi
            echo "TEST $REF = ${sha::7}: wird gebaut (nur privat)."; echo "bauen=ja" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          letzt=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/.quelle" 2>/dev/null || true)
          echo "Quelle $REF = ${sha::7}, zuletzt veröffentlicht: ${letzt::7}"
          if [ "$REF" = "main" ] && [ "$sha" = "$letzt" ] && [ "$ERZWINGEN" != "true" ]; then
            echo "Nichts Neues."; echo "bauen=nein" >> "$GITHUB_OUTPUT"
          else
            echo "bauen=ja" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Tests (Agent, Web, Browser)
    needs: pruefen
    if: needs.pruefen.outputs.bauen == 'ja'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { repository: "${{ env.QUELLE }}", ref: "${{ needs.pruefen.outputs.sha }}", token: "${{ secrets.SOURCE_TOKEN }}", persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Agent-, Versions-, Namens- und Update-Tests
        run: |
          set -e
          python tools/test-agent.py
          python tools/test-public-updates.py
          python tools/test-version.py
          python tools/test-names.py
          python tools/make-dist.py
      - name: Alle JS-Module auf Syntaxfehler prüfen
        run: |
          set -e
          for f in $(git ls-files 'js/*.js' 'js/**/*.js' 'sw.js'); do node --input-type=module --check < "$f" || { echo "Syntaxfehler: $f"; exit 1; }; done
          node tools/test-free-router.cjs
          node tools/test-preview-updates.cjs
      - name: Playwright (nur für Tests)
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Browser-Tests mit echten Klicks (Liste aus dem privaten ci.yml)
        run: |
          set -e
          python3 tools/dev-server.py > /tmp/dev.log 2>&1 &
          sleep 2
          liste=$(grep -oP 'for t in \K[^;]+(?=; do)' .github/workflows/ci.yml | head -1)
          [ -n "$liste" ] || { echo "Testliste in ci.yml nicht gefunden"; exit 1; }
          for t in $liste; do
            echo "::group::$t"
            node tools/$t.js 2>&1 | tee /tmp/t.log; rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then grep -E "^(FEHLER|FAIL)" /tmp/t.log | head -15 | sed "s/^/::error title=$t::/"; exit $rc; fi
          done

  echte-ki:
    name: Echte KI (Ollama, kein Mock)
    needs: pruefen
    if: needs.pruefen.outputs.bauen == 'ja'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { repository: "${{ env.QUELLE }}", ref: "${{ needs.pruefen.outputs.sha }}", token: "${{ secrets.SOURCE_TOKEN }}", persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Ollama + Playwright
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          sudo systemctl disable ollama || true
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Echter KI-Test
        timeout-minutes: 15
        run: |
          if [ ! -f tools/v391-real-ollama-test.js ]; then echo "Kein Echt-KI-Test in diesem Stand."; exit 0; fi
          python3 tools/dev-server.py > /tmp/dev.log 2>&1 &
          sleep 2
          set +e
          node tools/v391-real-ollama-test.js 2>&1 | tee /tmp/ki.log
          rc=${PIPESTATUS[0]}
          # Fehlgeschlagene Prüfungen als Annotation (lesbar ohne Protokoll-Download)
          grep -E "^(FEHLER|FAIL)" /tmp/ki.log | head -15 | sed 's/^/::error title=Echte KI::/'
          grep -E "^HINWEIS" /tmp/ki.log | head -10 | sed 's/^/::notice title=Echte KI::/'
          echo "::notice title=Echte KI::$(grep -cE '^(OK|FEHLER)' /tmp/ki.log) Prüfungen, davon $(grep -c '^FEHLER' /tmp/ki.log) Fehler, Code $rc"
          exit $rc

  schluessel:
    name: "TEST: Einweg-Schlüssel für die verschlüsselte Übergabe (ohne Projektcode)"
    # Secret liegt in der GitHub-Umgebung „test-freigabe“ (nur von main, siehe docs/TEST-KANAL.md) – andere Jobs sehen es nicht
    environment: test-freigabe
    needs: pruefen
    if: needs.pruefen.outputs.bauen == 'ja' && needs.pruefen.outputs.kanal == 'test'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      pub: ${{ steps.k.outputs.pub }}
      aktiv: ${{ steps.k.outputs.aktiv }}
    steps:
      - name: Schlüsselpaar erzeugen, privaten Teil nur verschlüsselt ablegen
        id: k
        env:
          TOKEN: ${{ secrets.TEST_RELEASE_TOKEN }}
          LAUF: ${{ github.run_id }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$TOKEN" ]; then
            echo "aktiv=nein" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret TEST_RELEASE_TOKEN fehlt – Build und Tests laufen, es wird aber nichts übergeben oder hochgeladen."
            exit 0
          fi
          pass=$(printf 'cc-test-uebergabe|%s|%s' "$LAUF" "$TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$pass"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out priv.pem 2>/dev/null
          openssl pkey -in priv.pem -pubout -out pub.pem
          PASS="$pass" openssl enc -aes-256-cbc -pbkdf2 -iter 300000 -salt -pass env:PASS -in priv.pem -out schluessel.enc
          rm -f priv.pem
          echo "pub=$(base64 -w0 pub.pem)" >> "$GITHUB_OUTPUT"
          echo "aktiv=ja" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.k.outputs.aktiv == 'ja'
        with: { name: test-schluessel, path: schluessel.enc, retention-days: 1 }

  windows:
    name: Windows (bauen, installieren, testen)
    needs: [pruefen, schluessel]
    # schluessel läuft nur im TEST-Kanal; im STABLE-Kanal ist er übersprungen und darf den Build nicht blockieren
    if: ${{ !cancelled() && needs.pruefen.result == 'success' && needs.pruefen.outputs.bauen == 'ja' && needs.schluessel.result != 'failure' }}
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: { repository: "${{ env.QUELLE }}", ref: "${{ needs.pruefen.outputs.sha }}", token: "${{ secrets.SOURCE_TOKEN }}", persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri" }
      - name: Agent-Tests (Windows)
        run: python tools/test-agent.py
      - name: Vorgänger-Build (für den Versionssprung-Test) bauen und beiseitelegen
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          python tools/stamp-build.py (100 + [int]"${{ github.run_number }}")
          python tools/make-dist.py
          npx --yes @tauri-apps/cli@2 icon icons/icon-512.png
          pip install pyinstaller
          pyinstaller --onefile --name carvis-agent --distpath agent-dist tools/desktop-agent.py
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item agent-dist/carvis-agent.exe src-tauri/binaries/carvis-agent-x86_64-pc-windows-msvc.exe
          npx --yes @tauri-apps/cli@2 build
          $d = Join-Path $env:RUNNER_TEMP "build-A"
          New-Item -ItemType Directory -Force $d | Out-Null
          Move-Item src-tauri/target/release/bundle/nsis/*-setup.exe $d
      - name: Endgültigen Installer bauen (ohne Testnummer, so wie er ausgeliefert wird)
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          git checkout -- js/version.js src-tauri/tauri.conf.json src-tauri/Cargo.toml tools/desktop-agent.py
          python tools/make-dist.py
          pyinstaller --onefile --name carvis-agent --distpath agent-dist tools/desktop-agent.py
          Copy-Item agent-dist/carvis-agent.exe src-tauri/binaries/carvis-agent-x86_64-pc-windows-msvc.exe -Force
          npx --yes @tauri-apps/cli@2 build
      - name: Installierte App testen
        run: $o = python tools/test-windows-app.py 2>&1 | ForEach-Object { "$_" }; $c = $LASTEXITCODE; $o; $o | Select-String '^(FEHLER|FAIL)' | Select-Object -First 15 | ForEach-Object { "::error title=Windows-App::$_" }; "::notice title=Windows-App::$(($o | Select-String '^(OK|FEHLER)').Count) Prüfungen, Code $c – $($o | Select-Object -Last 1)"; exit $c
      - name: 3.6.7-Installer aus dem privaten Release laden
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          $d = Join-Path $env:RUNNER_TEMP "old-367"
          New-Item -ItemType Directory -Force $d | Out-Null
          gh release download v3.6.7 --repo $env:QUELLE --pattern "CARVIS-CORE_3.6.7_x64-setup.exe" --pattern "SHA256SUMS.txt" --dir $d
          if ($LASTEXITCODE -ne 0) { throw "Download des 3.6.7-Releases fehlgeschlagen" }
          "CARVIS_OLD_DIR=$d" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Umstieg 3.6.7 -> neu und Rückweg (Nutzerdaten bleiben)
        run: python tools/test-migration.py (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe).FullName
      - name: Update-Kette (echte Installation, GitHub-Attrappe)
        run: python tools/test-update-chain.py (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe).FullName (Get-ChildItem "$env:RUNNER_TEMP/build-A/*-setup.exe").FullName
      - name: Portable CARVIS-CORE.exe bauen und testen
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          $env:CARVIS_AGENT_EXE = (Resolve-Path agent-dist/carvis-agent.exe).Path
          npx --yes @tauri-apps/cli@2 build --no-bundle --features portable
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/carvis-core.exe portable/CARVIS-CORE.exe -Force
          python tools/test-portable.py portable/CARVIS-CORE.exe
      - name: "TEST: Installer und portable EXE mit eigener Kennung bauen (überschreibt STABLE nie)"
        if: env.KANAL == 'test'
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/stable" | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe "$env:RUNNER_TEMP/stable/"
          $v = (Select-String -Path js/version.js -Pattern "VERSION = '([^']+)'").Matches[0].Groups[1].Value
          # Sichtbare Produktversion wie displayVersion() in js/version.js (D-051): 4.1.0 -> v1.1, 4.1.2 -> v1.1.2
          $p = $v.Split('.'); $m = [int]$p[0]; $pv = if ($m -ge 4) { "v$($m - 3).$($p[1])" + $(if ([int]$p[2]) { ".$($p[2])" } else { '' }) } else { $v }
          # Testnummer = Laufnummer (wie im Tag v<Version>-test.<Lauf>): App, Installer, Agent und Oberfläche kennen ihren Testbuild,
          # damit das Update-Center der Testversion neuere Testbuilds erkennt
          python tools/stamp-build.py ${{ github.run_number }}
          python tools/make-dist.py
          pyinstaller --noconfirm --onefile --name carvis-agent --distpath agent-dist tools/desktop-agent.py
          Copy-Item agent-dist/carvis-agent.exe src-tauri/binaries/carvis-agent-x86_64-pc-windows-msvc.exe -Force
          # TEST-Kennung = eigenes Datenprofil. Der Quellstand kann sie je Version festlegen (src-tauri/test-identifier.txt,
          # z. B. de.carviscore.app.test13 für v1.3), damit mehrere TEST-Versionen ohne gemeinsame Daten nebeneinander laufen.
          # Ohne Datei bleibt es bei de.carviscore.app.test (v1.1/v1.2 unverändert). Nur erlaubte Form, sonst Abbruch.
          $tid = 'de.carviscore.app.test'
          if (Test-Path src-tauri/test-identifier.txt) { $tid = (Get-Content src-tauri/test-identifier.txt -Raw).Trim() }
          if ($tid -notmatch '^de\.carviscore\.app\.test[a-z0-9]{0,12}$') { throw "Ungültige TEST-Kennung: $tid" }
          python -c "import json,sys; p='src-tauri/tauri.conf.json'; c=json.load(open(p,encoding='utf-8')); c['identifier']=sys.argv[2]; c['productName']='CARVIS CORE TEST'; [w.update(title=sys.argv[1]) for w in c.get('app',{}).get('windows',[])]; json.dump(c,open(p,'w',encoding='utf-8'),indent=2,ensure_ascii=False)" "CARVIS CORE $pv TEST" "$tid"
          $env:CARVIS_APP_ID = $tid
          "CARVIS_APP_ID=$tid" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Remove-Item src-tauri/target/release/bundle/nsis/*-setup.exe -Force
          npx --yes @tauri-apps/cli@2 build
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/test" | Out-Null
          Copy-Item -Path 'src-tauri/target/release/bundle/nsis/CARVIS CORE TEST_*-setup.exe' -Destination "$env:RUNNER_TEMP/test/"
          $env:CARVIS_AGENT_EXE = (Resolve-Path agent-dist/carvis-agent.exe).Path
          npx --yes @tauri-apps/cli@2 build --no-bundle --features portable
          Copy-Item src-tauri/target/release/carvis-core.exe "$env:RUNNER_TEMP/test/portable.exe" -Force
          "TEST_PV=$pv" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEST_V=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: "TEST: portable EXE testen (eigener Datenordner)"
        if: env.KANAL == 'test'
        run: $o = python tools/test-portable.py "$env:RUNNER_TEMP/test/portable.exe" 2>&1 | ForEach-Object { "$_" }; $c = $LASTEXITCODE; $o; $o | Select-String '^(FEHLER|FAIL)' | Select-Object -First 15 | ForEach-Object { "::error title=TEST portable::$_" }; "::notice title=TEST portable::$(($o | Select-String '^(OK|FEHLER)').Count) Prüfungen, Code $c – $($o | Select-Object -Last 1)"; exit $c
      - name: "TEST: neben STABLE installieren, starten, entfernen – STABLE-Programm und -Daten bleiben unverändert"
        if: env.KANAL == 'test'
        run: |
          if (-not (Test-Path tools/test-test-channel.py)) { Write-Host "Kein Koexistenz-Test in diesem Stand."; exit 0 }
          $o = python tools/test-test-channel.py (Get-ChildItem "$env:RUNNER_TEMP/stable/*-setup.exe").FullName (Get-ChildItem "$env:RUNNER_TEMP/test/*-setup.exe").FullName 2>&1 | ForEach-Object { "$_" }; $c = $LASTEXITCODE; $o; $o | Select-String '^(FEHLER|FAIL)' | Select-Object -First 15 | ForEach-Object { "::error title=TEST neben STABLE::$_" }; "::notice title=TEST neben STABLE::$(($o | Select-String '^(OK|FEHLER)').Count) Prüfungen, Code $c – $($o | Select-Object -Last 1)"; exit $c
      - name: "TEST: Dateien sammeln (Installer, portable EXE, Web-Paket, Prüfsummen)"
        if: env.KANAL == 'test'
        shell: pwsh
        run: |
          $n = "${{ github.run_number }}"
          New-Item -ItemType Directory -Force out | Out-Null
          # Name passend zum Update-Center ab v1.0 (CARVIS-CORE_<Version>_x64-setup.exe); Inhalt ist die separate App „CARVIS CORE TEST“
          Copy-Item (Get-ChildItem "$env:RUNNER_TEMP/test/*-setup.exe").FullName "out/CARVIS-CORE_$($env:TEST_V)-test.$($n)_x64-setup.exe"
          Copy-Item "$env:RUNNER_TEMP/test/portable.exe" "out/CARVIS-CORE-TEST-$($env:TEST_PV)-portable.exe"
          Compress-Archive -Path dist/* -DestinationPath "out/CARVIS-CORE-TEST-$($env:TEST_PV)-web.zip"
          Get-ChildItem out -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content -Encoding ascii out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt
      - name: "TEST: Selbsttest der Verschlüsselung auf Windows (nur Attrappe, keine echten Dateien)"
        if: env.KANAL == 'test'
        shell: bash
        run: |
          set -euo pipefail
          d=$(mktemp -d); cd "$d"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out t.pem 2>/dev/null
          openssl pkey -in t.pem -pubout -out tp.pem
          printf 'attrappe' > a.txt; tar -cf a.tar a.txt
          openssl rand -hex 32 | tr -d '\r\n' > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -iter 10000 -salt -pass file:k.txt -in a.tar -out a.enc
          openssl pkeyutl -encrypt -pubin -inkey tp.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in k.txt -out k.enc
          openssl pkeyutl -decrypt -inkey t.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in k.enc -out k2.txt
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 10000 -pass file:k2.txt -in a.enc -out b.tar
          cmp a.tar b.tar
          echo "::notice title=Verschlüsselung Windows::Selbsttest bestanden ($(openssl version))"
          cd /; rm -rf "$d"
      - name: "TEST: Paket verschlüsseln (nur mit dem Einweg-Schlüssel dieses Laufs lesbar; kein Schreibschlüssel hier)"
        if: env.KANAL == 'test' && needs.schluessel.outputs.aktiv == 'ja'
        shell: bash
        env:
          PUB: ${{ needs.schluessel.outputs.pub }}
        run: |
          set -euo pipefail
          umask 077
          echo "$PUB" | base64 -d > pub.pem
          tar -cf paket.tar -C out .
          # Ohne Zeilenende: das Windows-openssl schreibt Text mit CRLF und liest „file:“ im Textmodus, Linux liest binär
          # (Fehler #47 „bad decrypt“). Darum nur die 64 Hex-Zeichen, auf beiden Seiten gleich.
          openssl rand -hex 32 | tr -d '\r\n' > k.txt
          [ "$(wc -c < k.txt)" = 64 ] || { echo "::error::Übergabeschlüssel hat nicht 64 Zeichen"; exit 1; }
          openssl enc -aes-256-cbc -pbkdf2 -iter 10000 -salt -pass file:k.txt -in paket.tar -out paket.enc
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in k.txt -out k.enc
          rm -f k.txt paket.tar pub.pem
          mkdir -p uebergabe && mv paket.enc k.enc uebergabe/
          ls -l uebergabe
      - uses: actions/upload-artifact@v4
        if: env.KANAL == 'test' && needs.schluessel.outputs.aktiv == 'ja'
        with: { name: test-paket, path: uebergabe/*, retention-days: 1 }
      - name: Dateien sammeln (nur Installer und portable EXE – kein Quellcode)
        if: env.KANAL != 'test'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe out/
          Copy-Item portable/CARVIS-CORE.exe out/
          Get-ChildItem out -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content -Encoding ascii out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: env.KANAL != 'test'
        with: { name: windows, path: out/*, retention-days: 7 }

  uebergabe-probe:
    name: "TEST: Übergabe-Probe Windows → Linux (Regressionstest #47, ohne Secrets)"
    needs: pruefen
    if: needs.pruefen.outputs.bauen == 'ja' && needs.pruefen.outputs.kanal == 'test'
    uses: ./.github/workflows/uebergabe-probe.yml

  test-freigeben:
    name: "TEST: privates Pre-Release anlegen (nur wenn alle Tests grün; ohne Projektcode)"
    # Secret liegt in der GitHub-Umgebung „test-freigabe“ (nur von main, siehe docs/TEST-KANAL.md) – andere Jobs sehen es nicht
    environment: test-freigabe
    needs: [pruefen, schluessel, tests, echte-ki, windows, uebergabe-probe]
    # Ohne always()/failure(): läuft nur, wenn ALLE benötigten Jobs erfolgreich waren
    if: needs.pruefen.outputs.kanal == 'test' && needs.schluessel.outputs.aktiv == 'ja'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: test-schluessel, path: k }
      - uses: actions/download-artifact@v4
        with: { name: test-paket, path: p }
      - name: Entschlüsseln, Dateinamen und SHA-256 prüfen
        id: pruef
        env:
          TOKEN: ${{ secrets.TEST_RELEASE_TOKEN }}
          LAUF: ${{ github.run_id }}
        run: |
          set -euo pipefail
          umask 077
          pass=$(printf 'cc-test-uebergabe|%s|%s' "$LAUF" "$TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$pass"
          PASS="$pass" openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -pass env:PASS -in k/schluessel.enc -out priv.pem 2>/dev/null \
            || { echo "::error::Schritt 1/3: privater Einweg-Schlüssel nicht entschlüsselbar (anderer Schreibschlüssel oder andere Lauf-ID als im Job schluessel)"; exit 1; }
          openssl pkeyutl -decrypt -inkey priv.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in p/k.enc -out k.raw 2>/dev/null \
            || { echo "::error::Schritt 2/3: Übergabeschlüssel nicht entschlüsselbar (Paket gehört nicht zu diesem Lauf)"; exit 1; }
          # Zeilenenden entfernen (ältere Windows-Sender schrieben CRLF, Fehler #47) und Format prüfen
          tr -d '\r\n' < k.raw > k.txt
          grep -Eq '^[0-9a-f]{64}$' k.txt || { echo "::error::Schritt 2/3: Übergabeschlüssel hat ein unerwartetes Format"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 10000 -pass file:k.txt -in p/paket.enc -out paket.tar 2>/dev/null \
            || { echo "::error::Schritt 3/3: Paket nicht entschlüsselbar"; exit 1; }
          rm -f priv.pem k.raw k.txt
          # Nur flache, erwartete Dateinamen (keine Pfade, keine fremden Dateien)
          erlaubt='^\./$|^\./(CARVIS-CORE_[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9]+_x64-setup\.exe|CARVIS-CORE-TEST-v[0-9.]+-portable\.exe|CARVIS-CORE-TEST-v[0-9.]+-web\.zip|SHA256SUMS\.txt)$'
          if tar -tf paket.tar | grep -Ev "$erlaubt"; then echo "::error::Unerwartete Datei im Paket – abgebrochen."; exit 1; fi
          mkdir out && tar -xf paket.tar -C out --no-same-owner && rm -f paket.tar
          sed -i 's/\r$//' out/SHA256SUMS.txt
          # Jede ausgelieferte Datei genau einmal mit passender Summe (ein Selbsteintrag der Summendatei wird ignoriert)
          grep -v ' SHA256SUMS\.txt$' out/SHA256SUMS.txt > sums.chk
          for f in $(ls out | grep -v '^SHA256SUMS\.txt$'); do [ "$(grep -c "  $f\$" sums.chk)" = 1 ] || { echo "::error::Keine eindeutige Prüfsumme für $f"; exit 1; }; done
          [ "$(grep -c . sums.chk)" = "$(ls out | grep -vc '^SHA256SUMS\.txt$')" ] || { echo "::error::SHA256SUMS.txt nennt Dateien, die nicht im Paket sind"; exit 1; }
          (cd out && sha256sum -c ../sums.chk)
          inst=$(ls out | grep -E '_x64-setup\.exe$')
          v=$(echo "$inst" | sed -E 's/^CARVIS-CORE_([0-9]+\.[0-9]+\.[0-9]+)-test\.[0-9]+_x64-setup\.exe$/\1/')
          IFS=. read -r m mi pa <<< "$v"; pv=$([ "$m" -ge 4 ] && echo "v$((m-3)).${mi}$([ "$pa" != 0 ] && echo ".$pa")" || echo "$v")
          echo "v=$v" >> "$GITHUB_OUTPUT"; echo "pv=$pv" >> "$GITHUB_OUTPUT"
      - name: Privates Pre-Release anlegen (erst Entwurf, nach vollständigem Hochladen sichtbar)
        env:
          GH_TOKEN: ${{ secrets.TEST_RELEASE_TOKEN }}
          SHA: ${{ needs.pruefen.outputs.sha }}
          V: ${{ steps.pruef.outputs.v }}
          PV: ${{ steps.pruef.outputs.pv }}
          N: ${{ github.run_number }}
        run: |
          set -euo pipefail
          tag="v${V}-test.${N}"
          cat > notes.md <<EOF
          **CARVIS CORE ${PV} TEST – Testbuild ${N} (privat, nicht freigegeben)**

          - Installiert die **separate App „CARVIS CORE TEST“** (eigener Ordner, eigene Daten, eigener Agent). Deine STABLE-Version und ihre Daten bleiben unverändert.
          - Die Testversion öffnest du über das Startmenü: **CARVIS CORE TEST**. Beide Versionen können gleichzeitig laufen.
          - Updates der Testversion kommen nur über den privaten Testkanal (Updates → Entwicklerkanal in der Testversion).
          - Entfernen: Windows-Einstellungen → Apps → CARVIS CORE TEST (STABLE bleibt erhalten).
          - Ohne Installation: \`CARVIS-CORE-TEST-${PV}-portable.exe\`. Web-Paket: \`CARVIS-CORE-TEST-${PV}-web.zip\`.
          - Freigeschaltet, weil alle Tests grün waren: Browser-Tests, echter KI-Test mit kleinen Ollama-Modellen (Linux-Runner), Windows-Installation neben STABLE (Windows-Runner). **Nicht** auf deinem PC getestet; Mikrofon und echte Sprachausgabe nicht getestet.

          Technisch (für Updater und Diagnose): Build ${V}-test.${N}
          Quelle: ${SHA}
          EOF
          gh release create "$tag" out/* --repo "$QUELLE" --target "$SHA" --draft --prerelease --title "CARVIS CORE ${PV} TEST (Testbuild ${N})" --notes-file notes.md
          if ! gh release edit "$tag" --repo "$QUELLE" --draft=false --prerelease; then
            gh release delete "$tag" --repo "$QUELLE" --yes --cleanup-tag || true
            echo "::error::Freischalten fehlgeschlagen – Entwurf gelöscht."; exit 1
          fi
          # Bereitstellung wirklich prüfen: Dateien aus dem privaten Release neu laden und gegen die Prüfsummen testen
          mkdir -p kontrolle && gh release download "$tag" --repo "$QUELLE" -D kontrolle
          tr -d '\r' < kontrolle/SHA256SUMS.txt | grep -v ' SHA256SUMS\.txt$' > kontrolle.chk
          (cd kontrolle && sha256sum -c ../kontrolle.chk) || { echo "::error::Bereitgestellte Dateien stimmen nicht mit den Prüfsummen überein"; exit 1; }
          echo "::notice title=TEST-Kanal::Privates Test-Release $tag angelegt und geprüft ($(grep -c . kontrolle.chk) Dateien, SHA-256 korrekt; nur im Entwicklerkanal des Update-Centers sichtbar)."

  diagnose:
    name: "Diagnose bei Fehlern (welcher Job, welcher Schritt) + Fehlversuch merken"
    needs: [pruefen, tests, echte-ki, windows, uebergabe-probe, test-freigeben]
    if: failure() && needs.pruefen.outputs.bauen == 'ja'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Fehlgeschlagene Jobs und Schritte zusammenfassen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion=="failure") | "\(.name)|\([.steps[] | select(.conclusion=="failure") | .name] | join(", "))|\(.html_url)"' > fehler.txt || true
          { echo "## Diagnose: fehlgeschlagene Schritte"; echo; echo "| Job | Schritt | Protokoll |"; echo "|---|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          while IFS='|' read -r job schritt url; do
            echo "::error title=Diagnose::$job → ${schritt:-?} ($url)"
            echo "| $job | ${schritt:-?} | $url |" >> "$GITHUB_STEP_SUMMARY"
          done < fehler.txt
          echo "Fehlermeldungen der Prüfungen stehen als Annotationen am jeweiligen Job." >> "$GITHUB_STEP_SUMMARY"
          echo "${{ needs.pruefen.outputs.sha }}" > fehlversuch.txt
      - name: "TEST: Fehlversuch für diesen Stand merken (kein automatischer Wiederholungsversuch)"
        if: needs.pruefen.outputs.kanal == 'test'
        uses: actions/cache/save@v4
        with:
          path: fehlversuch.txt
          key: test-fehlversuch-${{ needs.pruefen.outputs.sha }}

  veroeffentlichen:
    name: Veröffentlichen (Website + Release)
    needs: [pruefen, tests, echte-ki, windows]
    # !cancelled() + ausdrücklich „success“ je Vorgänger: Ohne das überspringt GitHub den Job, weil der TEST-Job „schluessel“
    # (Vorgänger von windows) im STABLE-Kanal planmäßig übersprungen wird. Veröffentlicht wird weiterhin NUR, wenn alle
    # Prüfjobs wirklich erfolgreich waren.
    if: ${{ !cancelled() && needs.pruefen.result == 'success' && needs.tests.result == 'success' && needs.echte-ki.result == 'success' && needs.windows.result == 'success' && needs.pruefen.outputs.bauen == 'ja' && needs.pruefen.outputs.kanal == 'stable' && (github.event.inputs.ref || 'main') == 'main' && (github.event_name == 'schedule' || github.event.inputs.veroeffentlichen == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { repository: "${{ env.QUELLE }}", ref: "${{ needs.pruefen.outputs.sha }}", token: "${{ secrets.SOURCE_TOKEN }}", path: src, persist-credentials: false }
      - name: Version und Freigabe prüfen
        id: v
        working-directory: src
        run: |
          v=$(sed -n "s/^export const VERSION = '\([^']*\)'.*/\1/p" js/version.js)
          t=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          [ "$v" = "$t" ] || { echo "::error::Version uneinheitlich: $v / $t"; exit 1; }
          # Veröffentlichungssperre (D-046): JEDE Version nur mit genau diesem Eintrag in .github/release-freigabe.txt
          # (früher erst ab Hauptversion 4 – eine Nummer 1.x/3.x wäre ohne Freigabe veröffentlicht worden).
          f=$(grep -v '^#' .github/release-freigabe.txt 2>/dev/null | tr -d '[:space:]' || true)
          frei=nein
          [ "$f" = "$v" ] && frei=ja || echo "::warning::$v ist nicht freigegeben (.github/release-freigabe.txt: '${f:-leer}') – nichts veröffentlicht."
          # Produktversion für den Release-Titel (D-046): Build 4.x.y = CARVIS CORE v1.x.y
          IFS=. read -r m mi pa <<< "$v"; if [ "$m" -ge 4 ]; then label="CARVIS CORE v$((m-3)).${mi}$([ "$pa" != 0 ] && echo ".$pa")"; else label="CARVIS CORE $v"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "frei=$frei" >> "$GITHUB_OUTPUT"; echo "label=$label" >> "$GITHUB_OUTPUT"
      - name: Web-App zusammenstellen
        if: steps.v.outputs.frei == 'ja'
        working-directory: src
        run: |
          python3 tools/make-dist.py
          S=$(echo "${{ needs.pruefen.outputs.sha }}" | cut -c1-7)
          sed -i -E "s/^const CACHE = '([^']*)';/const CACHE = '\1-$S';/" dist/sw.js
          grep -m1 "^const CACHE" dist/sw.js
          if grep -rEq "ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9]{32,}" dist; then echo "::error::Möglicher Schlüssel gefunden"; exit 1; fi
      - name: Website (gh-pages) aktualisieren
        if: steps.v.outputs.frei == 'ja'
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
          cd site
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name README.md -exec rm -rf {} +
          cp -r ../src/dist/. .
          touch .nojekyll
          echo "${{ needs.pruefen.outputs.sha }}" > .quelle
          git add -A
          git config user.name "CARVIS CORE CI"; git config user.email "ci@users.noreply.github.com"
          git diff --cached --quiet && { echo "Unverändert."; exit 0; }
          git commit -q -m "Web-App ${{ steps.v.outputs.version }} (${{ needs.pruefen.outputs.sha }})"
          git push origin gh-pages
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.frei == 'ja'
        with: { name: windows, path: out }
      - name: Öffentliches Release bei neuer Versionsnummer
        if: steps.v.outputs.frei == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$V" --repo "${{ github.repository }}" >/dev/null 2>&1; then echo "Release v$V existiert bereits."; exit 0; fi
          cat > notes.md <<EOF
          ${{ steps.v.outputs.label }} für Windows (x64). Technischer Build: $V.

          - **Installer:** \`CARVIS-CORE_${V}_x64-setup.exe\` – installieren und starten.
          - **Portable:** \`CARVIS-CORE.exe\` – ohne Installation starten.
          - Nicht code-signiert: Windows SmartScreen zeigt „Unbekannter Herausgeber“ → „Weitere Informationen“ → „Trotzdem ausführen“.
          - Prüfsummen: \`SHA256SUMS.txt\`

          Vor der Veröffentlichung auf einem GitHub-Windows-Runner geprüft: Installation, Start mit Agent, Umstieg von 3.6.7 und zurück, Update-Kette, portabler Start; dazu Browser-Tests und ein echter KI-Test. Nicht auf einem Nutzer-PC getestet.

          Im Browser nutzen: https://nv4rmp8wyw-del.github.io/carvis-core-updates/
          EOF
          gh release create "v$V" out/* --repo "${{ github.repository }}" --title "${{ steps.v.outputs.label }}" --notes-file notes.md --latest
      - name: Bereitstellung prüfen (Website und Release zeigen denselben freigegebenen Stand)
        if: steps.v.outputs.frei == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
          SHA: ${{ needs.pruefen.outputs.sha }}
        run: |
          set -euo pipefail
          seite="https://$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z').github.io/${{ github.event.repository.name }}"
          for i in $(seq 1 20); do
            q=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/.quelle" 2>/dev/null || true)
            w=$(curl -fsSL "$seite/js/version.js?nocache=$i" 2>/dev/null | sed -n "s/^export const VERSION = '\([^']*\)'.*/\1/p" || true)
            [ "$q" = "$SHA" ] && [ "$w" = "$V" ] && break; sleep 30
          done
          [ "$q" = "$SHA" ] || { echo "::error::gh-pages zeigt nicht den veröffentlichten Stand (${q::7} statt ${SHA::7})"; exit 1; }
          [ "$w" = "$V" ] || { echo "::error::Website meldet Version '$w' statt $V"; exit 1; }
          mkdir -p kontrolle && gh release download "v$V" --repo "${{ github.repository }}" -D kontrolle
          (cd kontrolle && tr -d '\r' < SHA256SUMS.txt | sha256sum -c)
          echo "::notice title=Veröffentlichung::Website ($w), Quelle ${SHA::7} und Release v$V mit korrekten Prüfsummen bestätigt"

